[workspace]
resolver = "2"
members = ["crates/vault", "src-tauri"]

[workspace.package]
version = "1.4.1"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[profile.release]
# LTO « thin » + compilation parallèle : build bien plus rapide, binaire à peine plus gros.
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

# Argon2 (256 Mio) est inutilisable non optimisé : on optimise la crypto même en dev.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
