name: Windows

# Étiquettes de version : installateur Windows (NSIS, non signé pour l'instant) joint à
# la release, avec son empreinte signée par la clé du projet ; uniquement dans le dépôt
# public (Meme-Pas-Dev/Quayline). Lancement manuel possible partout (onglet Actions →
# Windows → Run workflow), pour un installateur d'essai (artifact).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: Tests et installateur (Windows)
    if: github.event_name == 'workflow_dispatch' || github.repository == 'Meme-Pas-Dev/Quayline'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Historique complet : build.rs calcule le numéro de build avec git.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      - name: Cache des sources Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: windows-cargo-src-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-src-v1-

      # Pas de cache de compilation pour les étiquettes : rien d'une exécution
      # antérieure n'entre dans l'installateur publié.
      - name: Cache du build release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/release
          key: windows-release-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-release-v1-

      - name: Dépendances npm
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Tests Rust
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Vérification Svelte/TypeScript
        run: npm run check

      # Le cache restaure target/release : on retire les installateurs précédents.
      - name: Construction de l'installateur
        run: rm -rf target/release/bundle && npx tauri build --bundles nsis -- --locked

      # Nom stable (« Quayline-X.Y.Z-windows-x64-setup.exe »), comme le .dmg.
      - name: Nom et empreinte
        working-directory: target/release/bundle/nsis
        run: |
          version=$(sed -nE 's/^ *"version": *"([^"]+)".*/\1/p' "$GITHUB_WORKSPACE/src-tauri/tauri.conf.json" | head -n1)
          for f in ./*.exe; do mv "$f" "Quayline-$version-windows-x64-setup.exe"; done
          sha256sum *.exe | tee SHA256SUMS.windows

      # Non signé : Windows SmartScreen l'annonce comme « éditeur inconnu ».
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quayline-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.windows
          if-no-files-found: error
          retention-days: 30

  # Sur une étiquette vX.Y.Z : empreinte signée (même clé GPG que pour Linux, secret
  # de l'environnement « release »), sans le code du projet, puis installateur joint à
  # la release créée par le workflow RPM.
  release:
    name: Publication dans la release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quayline-windows
          path: dist

      - name: Signature des empreintes
        working-directory: dist
        env:
          SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z ${SIGNING_KEY:-} ]]; then
            echo "::error::Secret PACKAGE_SIGNING_KEY absent de l'environnement « release »."
            exit 1
          fi
          export GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')
          sha256sum -c SHA256SUMS.windows
          gpg --batch --yes --local-user "$fpr" --armor --detach-sign SHA256SUMS.windows

      # La release est créée par le workflow RPM (seul créateur) : on attend qu'elle
      # existe, au plus 40 minutes.
      - name: Ajout de l'installateur à la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 80); do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              gh release upload "$TAG" --repo "$REPO" --clobber dist/*.exe dist/SHA256SUMS.windows*
              exit 0
            fi
            echo "Release $TAG pas encore créée, nouvel essai dans 30 s…"
            sleep 30
          done
          echo "La release $TAG n'a pas été créée par le workflow RPM." >&2
          exit 1
